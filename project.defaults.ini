# Family Link repository mechanics and host defaults.
#
# Rules:
# - Section names are lowercase dotted prefixes.
# - Keys are lowercase.
# - Every setting can be overridden by its uppercase qualified name:
#     [idf] path -> IDF_PATH
#     [command.install] timeout_seconds -> COMMAND_INSTALL_TIMEOUT_SECONDS
# - Set PROJECT_CONFIG to load a different INI file. Relative paths are
#   resolved from the repository root.
#
# Product-domain configuration (people, kits, devices, deployments, secrets)
# belongs in separate YAML files, not this host/repository contract.

[project]
config_version = 1
id = family-link
name = Family Link

[python]
minimum = 3.9
venv = .venv
requirements = requirements.txt

[idf]
path = ~/esp/esp-idf
version = v5.4.2
target = esp32s3
skip = false
reinstall = false

# Commands are argv arrays, not shell strings. This keeps execution explicit
# and portable. Add command.build, command.flash, and command.evaluate only
# when those operations exist in the active product tree.
[command.config]
argv = ["make", "config"]
cwd = .
timeout_seconds = 60

[command.help]
argv = ["make", "help"]
cwd = .
timeout_seconds = 60

[command.install]
argv = ["make", "install"]
cwd = .
timeout_seconds = 7200

[command.test]
argv = ["make", "test"]
cwd = .
timeout_seconds = 120

# Flows list named command sections. They state the repository's expected
# mechanics without imposing a workflow engine.
[flow.setup]
commands = config, install

[flow.implementation]
commands = test

[flow.post_repair]
commands = test
