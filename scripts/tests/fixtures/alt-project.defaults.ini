# Test fixture: same contract as config/host.defaults.ini with a different project name.

[project]
config_version = 1
id = family-link
name = Alt Family Link

[python]
minimum = 3.9
venv = .venv
requirements = requirements.txt

[idf]
path = ~/esp/esp-idf
version = v5.4.2
target = esp32s3
skip = false
reinstall = false

[config.deployment]
example = config/deployment/example.yaml
local = config/deployment/local.yaml
schema = config/deployment/deployment.schema.v1.json

[command.config]
argv = ["make", "config"]
cwd = .
timeout_seconds = 60

[command.config.host]
argv = ["make", "config.host"]
cwd = .
timeout_seconds = 60

[command.config.deployment]
argv = ["make", "config.deployment"]
cwd = .
timeout_seconds = 60

[command.help]
argv = ["make", "help"]
cwd = .
timeout_seconds = 60

[command.install]
argv = ["make", "install"]
cwd = .
timeout_seconds = 7200

[command.test]
argv = ["make", "test"]
cwd = .
timeout_seconds = 120

[flow.setup]
commands = config.host, install

[flow.implementation]
commands = test

[flow.post_repair]
commands = test
