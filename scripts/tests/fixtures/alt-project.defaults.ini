# Test fixture: same contract as project.defaults.ini with a different project name.

[project]
config_version = 1
id = family-link
name = Alt Family Link

[python]
minimum = 3.9
venv = .venv
requirements = requirements.txt

[idf]
path = ~/esp/esp-idf
version = v5.4.2
target = esp32s3
skip = false
reinstall = false

[command.config]
argv = ["make", "config"]
cwd = .
timeout_seconds = 60

[command.help]
argv = ["make", "help"]
cwd = .
timeout_seconds = 60

[command.install]
argv = ["make", "install"]
cwd = .
timeout_seconds = 7200

[command.test]
argv = ["make", "test"]
cwd = .
timeout_seconds = 120

[flow.setup]
commands = config, install

[flow.implementation]
commands = test

[flow.post_repair]
commands = test
