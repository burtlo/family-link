# Family Link host / repository mechanics (toolchain, make commands, flows).
#
# Product roster YAML lives under config/deployment/ (see [config.deployment]).
#
# Rules:
# - Section names are lowercase dotted prefixes.
# - Keys are lowercase.
# - Every setting can be overridden by its uppercase qualified name:
#     [idf] path -> IDF_PATH
#     [config.deployment] example -> CONFIG_DEPLOYMENT_EXAMPLE
# - Set PROJECT_CONFIG to load a different host INI. Relative paths are
#   resolved from the repository root.

[project]
config_version = 1
id = family-link
name = Family Link

[python]
minimum = 3.9
venv = .venv
requirements = requirements.txt

[idf]
path = ~/esp/esp-idf
version = v5.4.2
target = esp32s3
skip = false
reinstall = false

[config.deployment]
example = config/deployment/example.yaml
local = config/deployment/local.yaml
schema = config/deployment/deployment.schema.v1.json

[command.config]
argv = ["make", "config"]
cwd = .
timeout_seconds = 60

[command.config.host]
argv = ["make", "config.host"]
cwd = .
timeout_seconds = 60

[command.config.deployment]
argv = ["make", "config.deployment"]
cwd = .
timeout_seconds = 60

[command.help]
argv = ["make", "help"]
cwd = .
timeout_seconds = 60

[command.install]
argv = ["make", "install"]
cwd = .
timeout_seconds = 7200

[command.test]
argv = ["make", "test"]
cwd = .
timeout_seconds = 120

[flow.setup]
commands = config.host, install

[flow.implementation]
commands = test

[flow.post_repair]
commands = test
