# Family Link host / repository mechanics (toolchain, make commands, flows).
#
# Product roster YAML: config/deployment/ ([config.deployment]).
# Device labs host registry: config/labs.registry.yaml ([labs]).
#
# Rules:
# - Section names are lowercase dotted prefixes.
# - Keys are lowercase.
# - Every setting can be overridden by its uppercase qualified name:
#     [idf] path -> IDF_PATH
#     [config.deployment] example -> CONFIG_DEPLOYMENT_EXAMPLE
# - Set PROJECT_CONFIG to load a different host INI. Relative paths are
#   resolved from the repository root.

[project]
config_version = 1
id = family-link
name = Family Link

[python]
minimum = 3.9
venv = .venv
requirements = requirements.txt

[idf]
path = ~/esp/esp-idf
version = v5.4.2
target = esp32s3
skip = false
reinstall = false

[config.deployment]
example = config/deployment/example.yaml
local = config/deployment/local.yaml
schema = config/deployment/deployment.schema.v1.json

[labs]
registry = config/labs.registry.yaml
schema = config/labs/labs.registry.schema.v1.json

[firmware]
source = client/device
build = build/device
artifacts = artifacts/device/bootstrap
logs = logs/device
boot_seconds = 12

[command.build]
argv = ["make", "build"]
cwd = .
timeout_seconds = 900

[command.devices]
argv = ["make", "devices"]
cwd = .
timeout_seconds = 60

# Hardware mutations are explicit commands, never automatic repair flow steps.
[command.flash]
argv = ["make", "flash"]
cwd = .
timeout_seconds = 180

[command.flash.all]
argv = ["make", "flash.all"]
cwd = .
timeout_seconds = 900

[command.flash.mazi]
argv = ["make", "flash.mazi"]
cwd = .
timeout_seconds = 180

[command.flash.arlo]
argv = ["make", "flash.arlo"]
cwd = .
timeout_seconds = 180

[command.flash.lynn]
argv = ["make", "flash.lynn"]
cwd = .
timeout_seconds = 180

[command.flash.audrey]
argv = ["make", "flash.audrey"]
cwd = .
timeout_seconds = 180

[command.config]
argv = ["make", "config"]
cwd = .
timeout_seconds = 60

[command.config.host]
argv = ["make", "config.host"]
cwd = .
timeout_seconds = 60

[command.config.deployment]
argv = ["make", "config.deployment"]
cwd = .
timeout_seconds = 60

[command.config.labs]
argv = ["make", "config.labs"]
cwd = .
timeout_seconds = 60

[command.help]
argv = ["make", "help"]
cwd = .
timeout_seconds = 60

[command.install]
argv = ["make", "install"]
cwd = .
timeout_seconds = 7200

[command.test]
argv = ["make", "test"]
cwd = .
timeout_seconds = 120

[command.lab.help]
argv = ["make", "lab.help"]
cwd = .
timeout_seconds = 60

[command.lab.lab02]
argv = ["make", "lab.lab02"]
cwd = .
timeout_seconds = 600

[command.lab.lab02.build]
argv = ["make", "lab.lab02.build"]
cwd = .
timeout_seconds = 1200

[command.lab.lab02.flash]
argv = ["make", "lab.lab02.flash"]
cwd = .
timeout_seconds = 180

[command.lab.lab02.capture]
argv = ["make", "lab.lab02.capture"]
cwd = .
timeout_seconds = 600

[flow.setup]
commands = config.host, install

[flow.implementation]
commands = test, build

[flow.post_repair]
commands = test, build

[labs.lab02]
# Determine the workstation's current LAN IP for each lab build.
# Override only when auto-discovery cannot choose the desk network:
# LABS_LAB02_CLIENT_URL=http://<your-ip>:8765 make lab.lab02
client_url = auto
