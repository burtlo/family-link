# Host registry for device lab firmware (make lab.<name>, scripts/lab_host.py).
# Product lab IDs (LAB-02, …) and docs: docs/labs/README.md
# Standard: docs/standards/labs-configuration.md
$schema: config/labs/labs.registry.schema.v1.json
document: family-link.labs-registry/v1

labs:
  lab04:
    adapter: lab04
    lab_id: LAB-04
    evidence_slug: lab-04
    project_dir: client/labs/lab-04-sketch-format
    target: esp32s3
    description: Color sketch encoding, preview, malformed input, overflow, and cancellation
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-04-sketch-format-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-04-sketch-format-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-04-sketch-format/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 30
      flash_by_default: true
      instructions: |
        Manual: select and exercise each encoding and fault control during capture.
        Scripted: run the fixed encoding, checkpoint, legacy, malformed, overflow,
        and cancellation harness. Runs have no server; only the three decided
        fault inputs enter the experiment verdict. Format and performance choices
        remain open.

  lab02:
    adapter: lab02
    lab_id: LAB-02
    evidence_slug: lab-02
    project_dir: client/labs/lab-02-bounded-inbox
    target: esp32s3
    description: Bounded inbox; managed HTTP paging, manual or scripted workflow
    variants:
      # The managed HTTP workflow is the regular LAB-02 build. The local
      # fixture remains an explicit comparison backend, not the default.
      default: phaseb
      recycle:
        build_dir: build/labs/lab-02-bounded-inbox
      eager:
        build_dir: build/labs/lab-02-bounded-inbox-eager
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.eager
      scripted:
        build_dir: build/labs/lab-02-bounded-inbox-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - ../kconfig/sdkconfig.defaults.scripted
      phaseb:
        build_dir: build/labs/lab-02-bounded-inbox-phaseb
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.phaseb
      scripted-phaseb:
        build_dir: build/labs/lab-02-bounded-inbox-scripted-phaseb
        sdkconfig_defaults:
          - sdkconfig.defaults
          - ../kconfig/sdkconfig.defaults.scripted
          - sdkconfig.defaults.phaseb
    trace_parser: client/labs/lab-02-bounded-inbox/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 120
      flash_by_default: true
      instructions: |
        Regular managed HTTP runs: make lab.lab02 (manual free traversal) or
        make lab.lab02.scripted (automated harness, no operator touch). Both
        start, health-check, seed, capture, and stop the owned fixture server.
        BACKEND=local selects an explicit local-fixture comparison. Scenario
        and fixture defaults are recorded in each run manifest.
      instructions_doc: docs/labs/lab-02-implementation-outline.md#verification-scenarios
    workflow:
      server_path: server/labs/lab-02-paging/server.py
      bind_host: auto
      bind_port: 8765
      fixture_size_default: 64
      scenario_default: nominal
      deadlines_seconds:
        startup: 10
        health: 10
        seed: 10
        readiness: 15
        action: 5
        cleanup: 5

  lab05:
    lab_id: LAB-05
    evidence_slug: lab-05
    project_dir: client/labs/lab-05-transition-proof
    target: esp32s3
    description: Local two-state transition and simultaneous-resource proof; no server
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-05-transition-proof-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-05-transition-proof-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    run:
      capture_seconds_default: 30
      flash_by_default: true
      instructions: |
        Touch NEXT on BOX-3 once to move between the two proof states. This is a
        bounded lifecycle integration proof only; it is not a resource measurement.

  lab05peak:
    adapter: lab05peak
    lab_id: LAB-05
    evidence_slug: lab-05-peak
    project_dir: client/labs/lab-05-transition-proof
    target: esp32s3
    description: Resource-peak harness for a persistent root and a replace control; no server
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-05-transition-proof-peak-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.peak
      scripted:
        build_dir: build/labs/lab-05-transition-proof-peak-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
          - sdkconfig.defaults.peak
      replace:
        build_dir: build/labs/lab-05-transition-proof-peak-replace
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.peak
          - sdkconfig.defaults.peak.replace
      scripted-replace:
        build_dir: build/labs/lab-05-transition-proof-peak-scripted-replace
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
          - sdkconfig.defaults.peak
          - sdkconfig.defaults.peak.replace
    trace_parser: client/labs/lab-05-transition-proof/tools/parse_lab05_peak.py
    run:
      capture_seconds_default: 90
      flash_by_default: true
      instructions: |
        Manual capture exercises one persistent overlap, allocation failure, stale
        callback, or cancel. Scripted capture runs the persistent harness and
        requires LAB05_PEAK_HARNESS_DONE status=complete control=persistent after
        the armed reset. VARIANT=replace and VARIANT=scripted-replace select the
        replace control. This registration has no server. Decided experiment
        inputs are allocation failure, stale callback, and cancel. Overlap and
        replace stay exploratory observations.

  lab03:
    adapter: lab03
    lab_id: LAB-03
    evidence_slug: lab-03
    project_dir: client/labs/lab-03-media-playback
    target: esp32s3
    description: Bounded inbox audio and 120x120 timed sketch playback; provisional criteria
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-03-media-playback-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-03-media-playback-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-03-media-playback/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 780
      flash_by_default: true
      instructions: |
        Manual: Next/Play/Pause/Stop/Out. Scripted: fixed scenarios plus 600s sustained run.
        The paired fixed media server is owned by the shared runner on port 8766.
        Record BOX-3 screen and speaker together; absent acoustic evidence stays unmeasured.
      instructions_doc: client/labs/lab-03-media-playback/README.md

  lab10:
    adapter: lab10
    lab_id: LAB-10
    evidence_slug: lab-10
    project_dir: client/labs/lab-10-record-canvas
    target: esp32s3
    description: Bounded local record canvas with manual and deterministic evidence modes
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-10-record-canvas-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-10-record-canvas-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-10-record-canvas/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 180
      flash_by_default: true
      instructions: |
        Manual: choose LAB10_WORKLOAD=manual-* when selecting a documented gesture case,
        then draw or exercise the requested stop/cancel case during capture. Scripted:
        use make lab.lab10.scripted; it always reports
        scripted-human-like-multicolor-180s-v1: 18 paced strokes with palette changes.
        LAB10_WORKLOAD does not change that identity; synthetic-*-v1 identities are
        reserved for the host workload generator. Both modes
        require LAB10_READY; missing trace, synchronized screen/audio, or hardware-only
        measurements remain
        UNMEASURED/BLOCKED. This lab has no server or product networking.
      instructions_doc: client/labs/lab-10-record-canvas/README.md#l10-08-runner-parser-and-structured-evidence

  lab07:
    adapter: lab07
    lab_id: LAB-07
    evidence_slug: lab-07
    project_dir: client/labs/lab-07-readiness-roster
    target: esp32s3
    description: Readiness, synthetic roster, mute, and endpoint health
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-07-readiness-roster-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-07-readiness-roster-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-07-readiness-roster/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 90
      flash_by_default: true
      instructions: |
        Manual 320x240 screen. Scroll the operator guide. Status line shows stage,
        user count, focused user id, stale, and in-flight count.
        Wi-Fi down: Wi-Fi unavailable message and no cards.
        Wi-Fi return: immediate readiness check, then the synthetic roster.
        Empty roster: empty hangout message, not the connecting animation.
        One user: one touchable card under Sign in as ...
        Eight users: horizontal carousel; scroll sideways to reach all eight.
        Add: new card at the end, same focused id.
        Remove: that card leaves, focused id stays when the person remains.
        Reorder: same focused id on a moved card.
        One failed check: roster stays, then the refresh returns.
        Two failed checks: connecting animation and no cards.
        Invalid HTTP 200: connecting and no cards.
        Hold 1 second: the screen stays touchable during the real one-second hold.
        Mute: display goes blank except the lab stand-in.
        Unmute stand-in: immediate readiness check. The stand-in is lab chrome, not product chrome.
        Connecting, Wi-Fi, and empty copy are exploratory.
        Scripted: make lab.lab07.scripted runs the decided scenarios without taps,
        including one real 1-second timeout, one heartbeat, and one roster refresh.
        The 10-minute idle and 5-minute cadence are virtual-clock checks unless a run waits.
        Capture default is 90 seconds. Flash follows flash_by_default unless FLASH=0.

  lab08:
    adapter: lab08
    lab_id: LAB-08
    evidence_slug: lab-08
    project_dir: client/labs/lab-08-pin-cooldown
    target: esp32s3
    description: PIN entry, cooldown, and idempotent login fixture
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-08-pin-cooldown-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-08-pin-cooldown-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-08-pin-cooldown/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 90
      flash_by_default: true
      instructions: |
        Scroll the operator guide. The stage band does not cover it.
        Digits show as stars. After four digits the copy is checking...
        A wrong PIN shows wrong pin for 2 seconds. Five wrong PINs for one user
        show Too many attempts. Try again in the remaining seconds.
        The failure count belongs to the selected user.
        BOOT with no digits returns to the roster. BOOT with 1 to 3 digits clears them.
        After four digits BOOT is ignored.
        Mute during checking turns the display off. A late success does not undo mute.
        Each button names the action you are about to take.
        Scripted mode runs the decided scenarios without taps.
        The retry delays, wrong-pin copy, cooldown, and partial-entry return stay on the virtual clock.
        Capture default is 90 seconds. Flash follows flash_by_default unless FLASH=0.

  lab09:
    adapter: lab09
    lab_id: LAB-09
    evidence_slug: lab-09
    project_dir: client/labs/lab-09-session-isolation
    target: esp32s3
    description: Signed-in session isolation for late inbox, media, playback, and profile results
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-09-session-isolation-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-09-session-isolation-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-09-session-isolation/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 90
      flash_by_default: true
      instructions: |
        Scroll the operator guide. The stage band ends where the guide begins.
        This is a signed-in probe, not a product inbox.
        Fetch inbox, fetch media, write playback state, or update profile.
        Each operation keeps the id and session generation from submission.
        The screen shows whose session is active and whether a result was applied.
        Mute, then a late result stays stale or cancelled, hides user A's bytes, and leaves the display off.
        Sign out before the result and the stage stays signed out.
        Sign in as user B before user A's result. B's generation differs and A's bytes are not applied.
        Each button names the action you are about to take.
        Scripted mode runs the decided scenarios without taps.
        Capture default is 90 seconds. Flash follows flash_by_default unless FLASH=0.

  lab06:
    adapter: lab06
    lab_id: LAB-06
    evidence_slug: lab-06
    project_dir: client/labs/lab-06-stage-shell
    target: esp32s3
    description: Local stage shell, panel lifecycle, and bounded trace evidence; no server
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-06-stage-shell-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.manual
      scripted:
        build_dir: build/labs/lab-06-stage-shell-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-06-stage-shell/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 30
      flash_by_default: true
      instructions: |
        Manual: the main cancellation probe uses only the two large buttons: tap Cancel,
        then Exit+Data once, and watch the automatic reverse. Badge and Stale are optional
        separate probes. Capture ends after 30 seconds; set SECONDS= to change the window.
        Scripted: runs H-cycle, H-data, H-data-during-exit, H-level2-control, H-destroyed,
        H-cancel, then exploratory H-placeholder. Server is none. Host-only results do
        not establish target visual or performance claims. Do not set BACKEND; LAB-06 has
        no service backend and rejects non-default backend values before target I/O.
      instructions_doc: client/labs/lab-06-stage-shell/README.md

  lab11:
    adapter: lab11
    lab_id: LAB-11
    evidence_slug: lab-11
    project_dir: client/labs/lab-11-send-receipt
    target: esp32s3
    description: Frozen-capture send, receipt lookup, and failure probes
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-11-send-receipt-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-11-send-receipt-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-11-send-receipt/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 90
      flash_by_default: true
      instructions: |
        Manual: the static scene shows fixture lab11-send/v1, the frozen capture
        identity, the active acceptance condition, the expected result, the chunk
        probe, and part queue capacity 8. Next, Run, Chunk, and Cancel return
        without waiting for upload. Scripted: make lab.lab11.scripted runs every
        decided and exploratory scenario against the lab server on port 8770.
        Success phase text is condition met only after the active condition.
        Sent is not an outcome. Capture default is 90 seconds.
      instructions_doc: client/labs/lab-11-send-receipt/README.md

  lab12:
    adapter: lab12
    lab_id: LAB-12
    evidence_slug: lab-12
    project_dir: client/labs/lab-12-profile-settings
    target: esp32s3
    description: Profile preview, settings focus, and shared-profile failure propagation
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-12-profile-settings-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-12-profile-settings-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
      shared:
        build_dir: build/labs/lab-12-profile-settings-shared
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.shared
      scripted-shared:
        build_dir: build/labs/lab-12-profile-settings-scripted-shared
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.shared
          - sdkconfig.defaults.scripted-shared
    trace_parser: client/labs/lab-12-profile-settings/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 30
      flash_by_default: true
      instructions: |
        Visual only: make lab.lab12 or make lab.lab12.scripted. These commands
        never start a server. Shared profile only: make lab.lab12 VARIANT=shared
        KIT=<kit> or make lab.lab12.scripted VARIANT=scripted-shared KIT=<kit>;
        these own the synthetic fixture on port 8771. Settings preview is not
        saved until acknowledged; Cancel discards preview; rejected save says
        it was not saved. The sketch stroke swatch is separate. See the LAB-12
        report for exploratory policy observations and device evidence status.

  lab16:
    adapter: lab16
    lab_id: LAB-16
    evidence_slug: lab-16
    project_dir: client/labs/lab-16-attached-storage
    target: esp32s3
    description: SD-buffered 210s mic capture then h22 diary chunk upload
    variants:
      default: upload
      upload:
        build_dir: build/labs/lab-16-attached-storage-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
      server-offline-during-record:
        build_dir: build/labs/lab-16-attached-storage-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
      overlap-record-during-upload:
        build_dir: build/labs/lab-16-attached-storage-overlap
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.overlap
    run:
      capture_seconds_default: 720
      flash_by_default: true
      instructions: |
        Managed HTTP: host starts h22-style diary server on port 8776 before flash (upload variant).
        Device records 210 s PCM to SD, then uploads 210 x 1 s WAV chunks to /v1/diary.
        server-offline-during-record: server stays down until LAB16_STREAM completes, then starts for upload.
        overlap-record-during-upload: two 180 s messages; upload session 1 while recording message 2 on SD.
        Success: LAB16_UPLOAD status=complete uploaded=210 and LAB16_HARNESS_DONE status=complete.
        Overlap success: both sessions 180 chunks on server; verify_overlap_capture.py.
        Verify: python client/labs/lab-16-attached-storage/tools/verify_capture.py <log>
      instructions_doc: client/labs/lab-16-attached-storage/README.md

  lab14:
    lab_id: LAB-14
    evidence_slug: lab-14
    project_dir: client/labs/lab-14-device-ui-catalog
    target: esp32s3
    description: YAML-driven visual catalog of current device-ui layouts, panels, and screens
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-14-device-ui-catalog-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-14-device-ui-catalog-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    run:
      capture_seconds_default: 30
      flash_by_default: true
      instructions: |
        Visual catalog. The index lists packed scenes from docs/product/device-ui/catalog.
        Tap a scene to mount it at 320x240. Press BOOT to return to the index.
        Serial: list, scene <id>, next, prev, index.
        Scripted: walks every scene and prints LAB14_HARNESS_DONE. No server.
      instructions_doc: client/labs/lab-14-device-ui-catalog/README.md
