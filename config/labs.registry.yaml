# Host registry for device lab firmware (make lab.<name>, scripts/lab_host.py).
# Product lab IDs (LAB-02, …) and docs: docs/labs/README.md
# Standard: docs/standards/labs-configuration.md
$schema: config/labs/labs.registry.schema.v1.json
document: family-link.labs-registry/v1

labs:
  lab02:
    adapter: lab02
    lab_id: LAB-02
    evidence_slug: lab-02
    project_dir: client/labs/lab-02-bounded-inbox
    target: esp32s3
    description: Bounded inbox; managed HTTP paging, manual or scripted workflow
    variants:
      # The managed HTTP workflow is the regular LAB-02 build. The local
      # fixture remains an explicit comparison backend, not the default.
      default: phaseb
      recycle:
        build_dir: build/labs/lab-02-bounded-inbox
      eager:
        build_dir: build/labs/lab-02-bounded-inbox-eager
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.eager
      scripted:
        build_dir: build/labs/lab-02-bounded-inbox-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - ../kconfig/sdkconfig.defaults.scripted
      phaseb:
        build_dir: build/labs/lab-02-bounded-inbox-phaseb
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.phaseb
      scripted-phaseb:
        build_dir: build/labs/lab-02-bounded-inbox-scripted-phaseb
        sdkconfig_defaults:
          - sdkconfig.defaults
          - ../kconfig/sdkconfig.defaults.scripted
          - sdkconfig.defaults.phaseb
    trace_parser: client/labs/lab-02-bounded-inbox/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 120
      flash_by_default: true
      instructions: |
        Regular managed HTTP runs: make lab.lab02 (manual free traversal) or
        make lab.lab02.scripted (automated harness, no operator touch). Both
        start, health-check, seed, capture, and stop the owned fixture server.
        BACKEND=local selects an explicit local-fixture comparison. Scenario
        and fixture defaults are recorded in each run manifest.
      instructions_doc: docs/labs/lab-02-implementation-outline.md#verification-scenarios
    workflow:
      server_path: server/labs/lab-02-paging/server.py
      bind_host: auto
      bind_port: 8765
      fixture_size_default: 64
      scenario_default: nominal
      deadlines_seconds:
        startup: 10
        health: 10
        seed: 10
        readiness: 15
        action: 5
        cleanup: 5

  lab05:
    lab_id: LAB-05
    evidence_slug: lab-05
    project_dir: client/labs/lab-05-transition-proof
    target: esp32s3
    description: Local two-state transition and simultaneous-resource proof; no server
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-05-transition-proof-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-05-transition-proof-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    run:
      capture_seconds_default: 30
      flash_by_default: true
      instructions: |
        Touch NEXT on BOX-3 once to move between the two proof states. This is a
        bounded lifecycle integration proof only; it is not a resource measurement.

  lab03:
    adapter: lab03
    lab_id: LAB-03
    evidence_slug: lab-03
    project_dir: client/labs/lab-03-media-playback
    target: esp32s3
    description: Bounded inbox audio and 120x120 timed sketch playback; provisional criteria
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-03-media-playback-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-03-media-playback-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-03-media-playback/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 780
      flash_by_default: true
      instructions: |
        Manual: Next/Play/Pause/Stop/Out. Scripted: fixed scenarios plus 600s sustained run.
        The paired fixed media server is owned by the shared runner on port 8766.
        Record BOX-3 screen and speaker together; absent acoustic evidence stays unmeasured.
      instructions_doc: client/labs/lab-03-media-playback/README.md

  lab10:
    adapter: lab10
    lab_id: LAB-10
    evidence_slug: lab-10
    project_dir: client/labs/lab-10-record-canvas
    target: esp32s3
    description: Bounded local record canvas with manual and deterministic evidence modes
    variants:
      default: manual
      manual:
        build_dir: build/labs/lab-10-record-canvas-manual
        sdkconfig_defaults:
          - sdkconfig.defaults
      scripted:
        build_dir: build/labs/lab-10-record-canvas-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.scripted
    trace_parser: client/labs/lab-10-record-canvas/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 180
      flash_by_default: true
      instructions: |
        Manual: choose LAB10_WORKLOAD=manual-* when selecting a documented gesture case,
        then draw or exercise the requested stop/cancel case during capture. Scripted:
        use make lab.lab10.scripted; it always reports
        scripted-human-like-multicolor-180s-v1: 18 paced strokes with palette changes.
        LAB10_WORKLOAD does not change that identity; synthetic-*-v1 identities are
        reserved for the host workload generator. Both modes
        require LAB10_READY; missing trace, synchronized screen/audio, or hardware-only
        measurements remain
        UNMEASURED/BLOCKED. This lab has no server or product networking.
      instructions_doc: client/labs/lab-10-record-canvas/README.md#l10-08-runner-parser-and-structured-evidence
