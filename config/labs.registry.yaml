# Host registry for device lab firmware (make lab.<name>, scripts/lab_host.py).
# Product lab IDs (LAB-02, …) and docs: docs/labs/README.md
# Standard: docs/standards/labs-configuration.md
$schema: config/labs/labs.registry.schema.v1.json
document: family-link.labs-registry/v1

labs:
  lab02:
    lab_id: LAB-02
    evidence_slug: lab-02
    project_dir: client/labs/lab-02-bounded-inbox
    target: esp32s3
    description: Bounded inbox; managed HTTP paging, manual or scripted workflow
    variants:
      default: recycle
      recycle:
        build_dir: build/labs/lab-02-bounded-inbox
      eager:
        build_dir: build/labs/lab-02-bounded-inbox-eager
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.eager
      scripted:
        build_dir: build/labs/lab-02-bounded-inbox-scripted
        sdkconfig_defaults:
          - sdkconfig.defaults
          - ../kconfig/sdkconfig.defaults.scripted
      phaseb:
        build_dir: build/labs/lab-02-bounded-inbox-phaseb
        sdkconfig_defaults:
          - sdkconfig.defaults
          - sdkconfig.defaults.phaseb
      scripted-phaseb:
        build_dir: build/labs/lab-02-bounded-inbox-scripted-phaseb
        sdkconfig_defaults:
          - sdkconfig.defaults
          - ../kconfig/sdkconfig.defaults.scripted
          - sdkconfig.defaults.phaseb
    trace_parser: client/labs/lab-02-bounded-inbox/tools/parse_lab_trace.py
    run:
      capture_seconds_default: 120
      flash_by_default: true
      instructions: |
        Canonical managed HTTP runs: make lab.lab02 (manual free traversal) or
        make lab.lab02.scripted (automated harness, no operator touch). Both
        start, health-check, seed, capture, and stop the owned fixture server.
        BACKEND=local selects an explicit local-fixture comparison. The eager
        comparison remains make lab.lab02.eager. Scenario and fixture defaults
        are recorded in each run manifest.
      instructions_doc: docs/labs/lab-02-implementation-outline.md#verification-scenarios
    workflow:
      server_path: server/labs/lab-02-paging/server.py
      bind_host: auto
      bind_port: 8765
      fixture_size_default: 64
      scenario_default: nominal
      deadlines_seconds:
        startup: 10
        health: 10
        seed: 10
        readiness: 15
        action: 5
        cleanup: 5
